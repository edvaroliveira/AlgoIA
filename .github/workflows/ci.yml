name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    name: Lint + testes (sem banco)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, gd, mbstring, fileinfo
          coverage: none

      - name: Lint de sintaxe (php -l em todos os .php)
        run: |
          find . -name '*.php' -not -path './.git/*' -print0 \
            | xargs -0 -n1 -P4 php -l

      - name: Smoke estático (invariantes de código)
        run: php bin/smoke_static.php

      - name: Testes unitários
        run: php bin/run_tests.php
