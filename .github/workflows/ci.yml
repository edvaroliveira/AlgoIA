name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    name: Lint + testes (sem banco)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, pdo_sqlite, gd, mbstring, fileinfo
          coverage: none

      - name: Lint de sintaxe (php -l em todos os .php)
        run: |
          find . -name '*.php' -not -path './.git/*' -print0 \
            | xargs -0 -n1 -P4 php -l

      - name: Smoke estático (invariantes de código)
        run: php bin/smoke_static.php

      - name: Testes unitários
        run: php bin/run_tests.php

      - name: Testes da camada de dados (SQLite em memória)
        run: php bin/run_db_tests.php

  integration:
    name: Testes de integração (MySQL + HTTP)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: algoia_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_DATABASE: algoia_ci
      DB_USERNAME: root
      DB_PASSWORD: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, curl, mbstring, fileinfo
          coverage: none

      - name: Testes de integração reais (AP-08 / RP-07)
        run: php bin/run_integration_tests.php
